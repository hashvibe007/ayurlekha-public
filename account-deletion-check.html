<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Account Deletion Verification — Ayurlekha</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      max-width: 800px;
      margin: 0 auto;
      padding: 2rem 1.5rem;
      color: #1a1a1a;
      line-height: 1.7;
    }
    h1 { color: #2e7d32; font-size: 2rem; margin-bottom: 0.25rem; }
    h2 { color: #2e7d32; margin-top: 2rem; font-size: 1.2rem; }
    .meta { color: #666; font-size: 0.9rem; margin-bottom: 2rem; }
    a { color: #2e7d32; }

    .form-group { margin-top: 2rem; }
    label { display: block; font-weight: 600; margin-bottom: 0.5rem; }
    input[type="email"] {
      width: 100%;
      padding: 0.6rem 0.8rem;
      font-size: 1rem;
      border: 1px solid #ccc;
      border-radius: 6px;
      box-sizing: border-box;
    }
    button {
      margin-top: 0.75rem;
      padding: 0.6rem 1.4rem;
      background: #2e7d32;
      color: #fff;
      border: none;
      border-radius: 6px;
      font-size: 1rem;
      cursor: pointer;
    }
    button:disabled { background: #aaa; cursor: not-allowed; }

    #result { margin-top: 1.5rem; padding: 1rem 1.2rem; border-radius: 8px; display: none; }
    #result.found    { background: #e8f5e9; color: #1b5e20; border: 1px solid #a5d6a7; }
    #result.notfound { background: #f5f5f5; color: #444;    border: 1px solid #ddd; }
    #result.error    { background: #fff3e0; color: #e65100; border: 1px solid #ffcc80; }
  </style>
</head>
<body>
  <h1>Account Deletion Verification</h1>
  <p class="meta">App: Ayurlekha</p>

  <p>
    If you have deleted your Ayurlekha account and would like to confirm the deletion was recorded,
    enter your email address below. Your email is never sent to our servers —
    it is hashed in your browser before being checked.
  </p>

  <div class="form-group">
    <label for="email">Email address</label>
    <input type="email" id="email" placeholder="you@example.com" autocomplete="email" />
    <br />
    <button id="checkBtn" onclick="checkDeletion()">Check Status</button>
  </div>

  <div id="result"></div>

  <script>
    const SUPABASE_URL = 'https://mzdghkippeehtpttrsdo.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im16ZGdoa2lwcGVlaHRwdHRyc2RvIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzM0NzcyMzgsImV4cCI6MjA4OTA1MzIzOH0.MR9s2CulRUHg5YoUN6oOjo6x6PD7mxgaESyaaDtLyvc';

    async function sha256hex(str) {
      const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(str));
      return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2, '0')).join('');
    }

    async function checkDeletion() {
      const emailInput = document.getElementById('email');
      const btn = document.getElementById('checkBtn');
      const result = document.getElementById('result');

      const email = emailInput.value.trim().toLowerCase();
      if (!email) {
        emailInput.focus();
        return;
      }

      btn.disabled = true;
      result.style.display = 'none';

      try {
        const hash = await sha256hex(email);
        const url = `${SUPABASE_URL}/rest/v1/deleted_accounts?email_hash=eq.${hash}&select=deleted_at`;
        const res = await fetch(url, {
          headers: {
            'apikey': SUPABASE_ANON_KEY,
            'Accept': 'application/json'
          }
        });

        if (!res.ok) throw new Error(`HTTP ${res.status}`);

        const data = await res.json();

        if (data.length > 0) {
          const date = new Date(data[0].deleted_at).toLocaleDateString('en-US', {
            year: 'numeric', month: 'long', day: 'numeric'
          });
          result.className = 'found';
          result.innerHTML = `&#10003; Your account was deleted on <strong>${date}</strong>. All associated data has been removed.`;
        } else {
          result.className = 'notfound';
          result.innerHTML = 'No deletion record found for this email address. If you believe you deleted your account and do not see a record here, please <a href="mailto:support@ayurlekha.app">contact support</a>.';
        }
      } catch (err) {
        result.className = 'error';
        result.innerHTML = 'Something went wrong. Please try again.';
        console.error(err);
      }

      result.style.display = 'block';
      btn.disabled = false;
    }

    document.getElementById('email').addEventListener('keydown', function(e) {
      if (e.key === 'Enter') checkDeletion();
    });
  </script>
</body>
</html>
